# Commands the validation pipeline runs for this repository.
# Hosted CI is not set up here, so this runs locally.
# The test command also runs shellcheck over the shell scripts, so there is
# no separate lint command.
commands:
  test: 'sh tests/run.sh'

# Public repository: keep PR bodies short and the run intent out of them.
pr:
  publish_intent: false
  appendix: collapsed

# Mark a failing test command as pre-existing when it also fails on the base.
test:
  base_attribution: true
